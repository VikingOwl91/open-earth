name: Refresh geoscience snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main, feat/p1-trenches-bathymetry, feat/p1-pvmbg-status]
    paths:
      - scripts/update_data.py
      - scripts/update_trenches.py
      - scripts/update_pvmbg.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: open-earth-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh core snapshots (GVP)
        run: python scripts/update_data.py
      - name: Refresh seafloor trenches (GEBCO)
        run: python scripts/update_trenches.py
      - name: Refresh regional volcano monitoring (PVMBG)
        continue-on-error: true
        id: pvmbg
        run: python scripts/update_pvmbg.py
      - name: Report snapshot status
        if: always()
        run: |
          if [ "${{ steps.pvmbg.outcome }}" = "failure" ]; then
            echo "::warning title=PVMBG Snapshot Stale::PVMBG / MAGMA Indonesia snapshot could not be refreshed; retained previous snapshot if present."
          fi
      - name: Run data tests
        run: python -m unittest discover tests
      - name: Commit changed snapshots
        run: |
          git config user.name 'open-earth-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'chore(data): refresh geoscience snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Snapshot push raced with another update; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo 'Failed to push refreshed snapshots after 3 attempts.' >&2
          exit 1
