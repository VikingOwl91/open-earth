name: Refresh geoscience snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [feat/data-pipeline-roadmap]
    paths:
      - scripts/update_data.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: open-earth-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh snapshots
        run: python scripts/update_data.py
      - name: Commit changed snapshots
        run: |
          git config user.name 'open-earth-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'chore(data): refresh geoscience snapshots'
          git push
