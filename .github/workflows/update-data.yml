name: Refresh geoscience snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main, feat/p1-history-inspector]
    paths:
      - scripts/update_data.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: open-earth-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh snapshots
        run: python scripts/update_data.py
      - name: Commit changed snapshots
        run: |
          git config user.name 'open-earth-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'chore(data): refresh geoscience snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Snapshot push raced with another update; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo 'Failed to push refreshed snapshots after 3 attempts.' >&2
          exit 1
