<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#081018"/><title>Open Earth</title><meta name="description" content="Explore live Earth activity and geological context on one open map."/><link rel="preconnect" href="https://unpkg.com"/><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"/><link rel="stylesheet" href="./src/style.css"/><link rel="stylesheet" href="./src/ui-fixes.css"/></head>
<body><main id="app"><div id="map" aria-label="Interactive map of Earth"></div><div id="map-loading" class="map-loading" hidden><span></span> Updating map…</div>
<header class="brand panel"><div class="mark">◎</div><div><strong>OPEN EARTH</strong><span>living geology explorer</span></div></header>
<section class="controls panel" aria-label="Map controls"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Find Jakarta, Krakatau, Japan…" autocomplete="off"/></label><div id="search-results" class="search-results" hidden></div>
<div class="control-title">LIVE</div><label><input id="earthquakes" type="checkbox" checked/><i class="dot quake"></i> Earthquakes <b id="quake-count">…</b></label><label><input id="activity" type="checkbox" checked/><i class="dot activity"></i> Volcanic reports <b id="activity-count">…</b></label>
<div class="control-title">GEOLOGY</div><label><input id="volcanoes" type="checkbox" checked/><i class="dot volcano"></i> Known volcanoes <b id="volcano-count">…</b></label><label><input id="plates" type="checkbox" checked/><i class="dot plate"></i> Plate boundaries</label><label><input id="faults" type="checkbox"/><i class="line fault"></i> Active faults <b id="fault-count">off</b></label>
<div class="control-title">EARTHQUAKES</div><div class="segmented" id="range"><button data-range="hour">1h</button><button data-range="day" class="active">24h</button><button data-range="week">7d</button></div>
<div class="control-title">VIEW</div><div class="view-grid"><label>Projection<select id="projection"><option value="mercator">Mercator</option><option value="globe">Globe</option><option value="equal" disabled>Equal Earth (planned)</option></select></label><label>Base map<select id="basemap"><option value="dark">Dark</option><option value="positron">Positron</option><option value="liberty">Liberty</option><option value="fiord">Fiord</option><option value="classic">Classic</option></select></label></div><div id="projection-note" class="note">Classic Web Mercator projection.</div><button id="reset-view" class="reset-view" type="button">Reset view & settings</button><div id="status" class="status">Loading public sources…</div></section>
<aside id="details" class="details panel" hidden><button id="details-close" class="details-close" aria-label="Close details">×</button><div id="details-body"></div></aside>
<aside class="about panel"><strong>What is the Earth doing?</strong><span>Live events + geological context. Every layer keeps its source visible.</span></aside></main><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script src="./src/app.js"></script><script src="./src/ui-fixes.js"></script></body></html>
