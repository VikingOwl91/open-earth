<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#081018" />
  <title>Open Earth</title>
  <meta name="description" content="Explore earthquakes, volcanoes, and plate tectonics on one open map." />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Interactive map of Earth"></div>

    <header class="brand panel">
      <div class="mark">◎</div>
      <div><strong>OPEN EARTH</strong><span>living geology explorer</span></div>
    </header>

    <section class="controls panel" aria-label="Map controls">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Find Jakarta, Krakatau, Japan…" autocomplete="off" /></label>
      <div id="search-results" class="search-results" hidden></div>
      <div class="control-title">LAYERS</div>
      <label><input id="earthquakes" type="checkbox" checked /> <i class="dot quake"></i> Earthquakes <b id="quake-count">…</b></label>
      <label><input id="volcanoes" type="checkbox" checked /> <i class="dot volcano"></i> Volcanoes <b id="volcano-count">…</b></label>
      <label><input id="plates" type="checkbox" checked /> <i class="dot plate"></i> Plate boundaries</label>
      <div class="control-title">EARTHQUAKES</div>
      <div class="segmented" id="range">
        <button data-range="hour">1h</button><button data-range="day" class="active">24h</button><button data-range="week">7d</button>
      </div>
      <div id="status" class="status">Loading public sources…</div>
    </section>

    <aside class="about panel">
      <strong>What is the Earth doing?</strong>
      <span>Live events + geological context. Every layer keeps its source visible.</span>
    </aside>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
